# A period's limit_brightness is a ceiling over an explicit per-device level:
# device 101 asks for 80 but the period caps at 30; device 102 asks for 20 and
# is left alone because it is already under the cap.
plugin_config:
  default_lock_duration: 5
  default_lock_extension_duration: 2
  global_behavior_variables: []
lighting_periods:
  - id: 1
    name: Capped
    mode: On and Off
    from_time_hour: 0
    from_time_minute: 0
    to_time_hour: 23
    to_time_minute: 59
    limit_brightness: 30
zones:
  - name: Zone1
    lighting_period_ids:
      - 1
    device_settings:
      on_lights_dev_ids:
        - 101
        - 102
      off_lights_dev_ids: []
      luminance_dev_ids:
        - 201
      presence_dev_ids:
        - 301
    minimum_luminance_settings:
      minimum_luminance: 100
      minimum_luminance_use_variable: false
      minimum_luminance_var_id: null
      adjust_brightness: false
    behavior_settings:
      lock_duration: null
      extend_lock_when_active: false
      lock_extension_duration: null
      off_lights_behavior: "do not adjust unless no presence"
      unlock_when_no_presence: false
    advanced_settings:
      exclude_from_lock_dev_ids: []
    device_period_map:
      "101":
        "1": 80
      "102":
        "1": 20
device_states:
  101:
    brightness: 0
  102:
    brightness: 0
  201:
    sensorValue: 0
  301:
    onState: true
expected:
  new_targets:
    - dev_id: 101
      brightness: 30
    - dev_id: 102
      brightness: 20
  exclusions: []
  device_changes:
    - ["🔆", "Dev-101: 0 → 30"]
    - ["🔆", "Dev-102: 0 → 20"]
