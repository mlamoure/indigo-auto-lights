# Per-device brightness: each light takes its own level from device_period_map,
# and a cell left as `true` falls back to the zone's normal calculation.
plugin_config:
  default_lock_duration: 5
  default_lock_extension_duration: 2
  global_behavior_variables: []
lighting_periods:
  - id: 1
    name: Overnight
    mode: On and Off
    from_time_hour: 0
    from_time_minute: 0
    to_time_hour: 23
    to_time_minute: 59
zones:
  - name: Zone1
    lighting_period_ids:
      - 1
    device_settings:
      on_lights_dev_ids:
        - 101
        - 102
        - 103
      off_lights_dev_ids: []
      luminance_dev_ids:
        - 201
      presence_dev_ids:
        - 301
    minimum_luminance_settings:
      minimum_luminance: 100
      minimum_luminance_use_variable: false
      minimum_luminance_var_id: null
      adjust_brightness: false
    behavior_settings:
      lock_duration: null
      extend_lock_when_active: false
      lock_extension_duration: null
      off_lights_behavior: "do not adjust unless no presence"
      unlock_when_no_presence: false
    advanced_settings:
      exclude_from_lock_dev_ids: []
    device_period_map:
      "101":
        "1": 10
      "102":
        "1": 60
      "103":
        "1": true
device_states:
  101:
    brightness: 0
  102:
    brightness: 0
  103:
    brightness: 0
  201:
    sensorValue: 0
  301:
    onState: true
expected:
  new_targets:
    - dev_id: 101
      brightness: 10
    - dev_id: 102
      brightness: 60
    - dev_id: 103
      brightness: 100
  exclusions: []
  device_changes:
    - ["🔆", "Dev-101: 0 → 10"]
    - ["🔆", "Dev-102: 0 → 60"]
    - ["🔆", "Dev-103: 0 → 100"]
